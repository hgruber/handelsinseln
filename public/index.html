<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1a30">
<title>Die Handelsinseln</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/lobby.css">
</head>
<body>
<!-- gemeinsame Gradienten/Clips (Art.defs) – bewusst NICHT display:none -->
<svg id="defs" width="0" height="0" aria-hidden="true" style="position:absolute"></svg>

<div id="sea"><div class="wv w1"></div><div class="wv w2"></div><div class="vignette"></div></div>
<svg id="board" xmlns="http://www.w3.org/2000/svg" hidden aria-label="Spielbrett"><g id="world"></g></svg>

<!-- Anmeldung -->
<main id="login" class="screen" hidden>
  <form id="loginForm" class="card glass login" autocomplete="off">
    <div class="logo" aria-hidden="true"></div>
    <h1>Die Handelsinseln</h1>
    <label class="fld"><span>Dein Name</span>
      <input id="nameIn" maxlength="20" required placeholder="z. B. Käpt'n Anna" autocomplete="nickname">
    </label>
    <div class="fld"><span id="swLabel">Deine Farbe</span><div id="swatches" class="swatches" role="radiogroup" aria-labelledby="swLabel"></div></div>
    <div class="fld"><span>Spiele</span><div id="gameList" class="games" role="listbox" aria-label="Beitretbare Spiele"></div></div>
    <div class="login-act">
      <button class="btn gold big" id="joinBtn" type="submit">Beitreten</button>
      <button class="btn big ghostb" id="createBtn" type="button">Neues Spiel eröffnen</button>
    </div>
    <p id="loginInfo" class="hint"></p>
  </form>
</main>

<!-- Lobby -->
<main id="lobby" class="screen lobby" hidden>
  <div class="lb-wrap">
    <section class="lb-prev" aria-label="Spielfeld-Vorschau">
      <div class="lb-prevbar glass"><b>Spielfeld</b><span id="lbVariantName" class="muted"></span><span class="grow"></span><span id="lbRegen"></span></div>
      <div id="lobbyPreview" class="lb-prevarea"></div>
    </section>
    <section class="lb-side glass">
      <header class="lb-head"><div><h1>Lobby</h1><p id="lbGame" class="sub"></p></div><button class="link" id="leaveBtn" type="button">Lobby verlassen</button></header>
      <div class="lb-scroll">
        <h3 class="lb-h">Spieler <small id="lbCount"></small></h3>
        <ul id="lobbyList" class="lobby-list"></ul>
        <div id="lobbyVoice" class="lb-voice"></div>
        <h3 class="lb-h">Spielfeld &amp; Variante</h3>
        <div id="lobbyVariants" class="variants"></div>
        <div id="lobbySeats" class="lb-seats"></div>
        <h3 class="lb-h">Abweichende Regeln <small id="devCount"></small></h3>
        <div id="lobbyDev" class="devbox"></div>
        <div id="lobbySettings"></div>
        <h3 class="lb-h">Chat</h3>
        <div id="lobbyChat" class="lb-chat scroll"></div>
        <form id="lobbyChatForm" class="lb-chatform"><input id="lobbyChatIn" maxlength="200" placeholder="Nachricht…" autocomplete="off"><button class="btn small" type="submit">Senden</button></form>
      </div>
      <div class="row center lb-act" id="lobbyAct"></div>
    </section>
  </div>
</main>

<!-- Statistik nach Spielende -->
<main id="stats" class="screen stats" hidden></main>

<!-- Spiel-HUD -->
<div id="hud" hidden>
  <div id="banner" role="status" aria-live="polite"></div>
  <aside id="players" aria-label="Spieler"></aside>
  <div id="camBtns">
    <button class="ibtn" id="btnMenu" title="Spielmenü" aria-label="Spielmenü" aria-haspopup="true"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4,7 H20 M4,12 H20 M4,17 H20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <span id="hudMic"></span>
    <button class="ibtn" id="btnFit" title="Zentrieren (Doppelklick auf das Brett)" aria-label="Zentrieren">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4,9 V4 H9 M15,4 H20 V9 M20,15 V20 H15 M9,20 H4 V15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg></button>
    <button class="ibtn" id="btnIn" title="Heranzoomen" aria-label="Heranzoomen">+</button>
    <button class="ibtn" id="btnOut" title="Herauszoomen" aria-label="Herauszoomen">−</button>
    <button class="ibtn" id="btnHelp" title="Spielregeln &amp; Baukosten" aria-label="Hilfe">?</button>
  </div>
  <button id="sideToggle" class="tab" title="Protokoll &amp; Chat ein-/ausklappen" aria-label="Protokoll ein- oder ausklappen"></button>
  <aside id="side">
    <div id="tradeDock"></div>
    <section id="logPanel" class="glass">
      <header>
        <button class="tabbtn on" data-tab="log">Protokoll</button>
        <button class="tabbtn" data-tab="chat">Chat<i id="chatDot" hidden></i></button>
        <button class="tabbtn" data-tab="rules" id="rulesTab">Regeln</button>
      </header>
      <div id="logList" class="scroll"></div>
      <div id="chatList" class="scroll" hidden></div>
      <div id="rulesList" class="scroll devbox" hidden></div>
      <form id="chatForm"><input id="chatIn" maxlength="200" placeholder="Nachricht…" autocomplete="off"><button class="btn small" type="submit">Senden</button></form>
    </section>
  </aside>
  <footer id="bottom" class="glass">
    <div id="hand">
      <div id="resRow"></div>
      <div id="devRow"></div>
      <div id="score"></div>
    </div>
    <div id="build"></div>
    <div id="dicebox">
      <div id="dice">
        <div class="die" id="d1"></div>
        <div class="die" id="d2"></div>
      </div>
      <div id="primary"></div>
    </div>
  </footer>
</div>

<div id="modalRoot"></div>
<div id="dlgRoot"></div>
<div id="voiceAudio" hidden></div>
<div id="toasts" aria-live="assertive"></div>
<div id="conn" hidden>Verbindung wird neu aufgebaut…</div>

<script src="/shared/geom.js"></script>
<script src="/art.js"></script>
<script src="/trade.js"></script>
<script src="/voice.js"></script>
<script src="/lobby.js"></script>
<script src="/menu.js"></script>
<script src="/app.js"></script>
</body>
</html>
